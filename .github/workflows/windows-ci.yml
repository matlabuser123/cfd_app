name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure debug
        run: cmake --preset windows-debug

      - name: Build debug
        run: cmake --build --preset debug --parallel

      - name: Test debug
        run: ctest --test-dir build/debug --output-on-failure

      - name: Configure release
        run: cmake --preset windows-release

      - name: Build release
        run: cmake --build --preset release --parallel

      - name: Test release
        run: ctest --test-dir build/release --output-on-failure

      - name: Package release ZIP
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File ./scripts/package-release.ps1

      - name: Validate extracted package
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File ./scripts/clean-machine-validate.ps1 -PackagePath build/release/CFDApp-0.1.0-Windows-x64.zip

      - name: Validate fresh installation
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File ./scripts/installation-test.ps1 -BuildDirectory build/release

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CFDApp-Windows-x64
          path: build/release/CFDApp-0.1.0-Windows-x64.zip
          if-no-files-found: error